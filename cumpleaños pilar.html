<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>¡Feliz Cumpleaños Pilar!</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Great+Vibes&family=Montserrat:wght@400;600;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- GSAP Animation Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000000;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            width: 100vw;
            height: 100vh;
        }

        /* Confeti de fondo global */
        #galaxyCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #000000;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        /* Estructura para ocultar/mostrar pantallas */
        .hidden-screen {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        .screen-container {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .subtitle {
            font-size: 25px;
            letter-spacing: 3px;
            color: #987912;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255,180,50,.6);
            font-weight: 700;
            animation: surpriseGlow 2s ease-in-out infinite;
        }

        @keyframes surpriseGlow {
            0%, 100% {
                transform: scale(1);
                text-shadow: 0 0 12px rgba(255, 180, 50, .55), 0 0 22px rgba(255, 80, 150, .35);
            }
            50% {
                transform: scale(1.05);
                text-shadow: 0 0 20px rgba(255, 215, 0, .95), 0 0 38px rgba(255, 80, 150, .75);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .subtitle {
                animation: none;
            }
        }

        h1.main-h1 {
            font-size: 42px;
            margin-bottom: 15px;
            font-family: 'Fredoka', sans-serif;
            text-align: center;
            text-shadow: 0 0 25px rgba(255,255,255,.9), 0 0 45px rgba(255,180,50,.6);
            color: #ffd166;
            animation: mainBirthdayGlow 2.4s ease-in-out infinite;
        }

        @keyframes mainBirthdayGlow {
            0%, 100% {
                transform: scale(1);
                text-shadow: 0 0 25px rgba(255,255,255,.9), 0 0 45px rgba(255,180,50,.6);
            }
            50% {
                transform: scale(1.04);
                text-shadow: 0 0 30px rgba(255,255,255,1), 0 0 58px rgba(255,180,50,.6), 0 0 78px rgba(255,80,150,.65);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            h1.main-h1 {
                animation: none;
            }
        }

        .description {
            font-size: 14px;
            color: #856d0f;
            margin-bottom: 25px;
            font-style: italic;
            text-shadow: 0 0 10px rgba(255,200,50,.4);
            text-align: center;
        }

        #countdown-message {
            font-size: 18px;
            font-weight: 700;
        }

        /* Cuenta regresiva */
        .countdown-container {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .box {
            background: rgba(109, 99, 61, 0.85);
            border: 1px solid rgba(255, 200, 50, 0.4);
            padding: 15px 20px;
            border-radius: 12px;
            min-width: 65px;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 25px rgba(255, 42, 109, 0.3);
            text-align: center;
        }

        .box span {
            display: block;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        .box label {
            font-size: 10px;
            color: #ffccd5;
            letter-spacing: 1px;
        }

        .btn {
            background: linear-gradient(135deg, rgba(220, 20, 80, 0.8), rgba(200, 140, 20, 0.7));
            color: #ffffff;
            border: 1px solid rgba(255, 215, 0, 0.8);
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
            box-shadow: 0 0 25px rgba(255, 42, 109, 0.5), 0 0 15px rgba(255, 215, 0, 0.6);
        }

        .btn:hover {
            background: linear-gradient(135deg, rgba(255, 42, 109, 1), rgba(255, 180, 0, 0.9));
            transform: scale(1.06);
            box-shadow: 0 0 35px rgba(255, 42, 109, 0.8);
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.75;
        }

        /* Caja de regalo animada */
        .gift-box-container {
            cursor: pointer;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .gift-box-wrapper {
            position: relative;
            margin: 15px 0;
            filter: drop-shadow(0 0 35px rgba(255,200,50,.6));
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform .4s ease;
        }

        .gift-box-wrapper:hover {
            transform: scale(1.05);
        }

        @keyframes shakeBox {
            0% { transform: rotate(0deg) scale(1); }
            20% { transform: rotate(-6deg) scale(1.05); }
            40% { transform: rotate(6deg) scale(1.05); }
            60% { transform: rotate(-4deg) scale(1.03); }
            80% { transform: rotate(4deg) scale(1.03); }
            100% { transform: rotate(0deg) scale(1); }
        }
        .gift-box-wrapper.shake { animation: shakeBox 0.5s ease-in-out; }

        .gift-lid {
            width: 156px;
            height: 26px;
            background: linear-gradient(145deg, rgba(255,200,50,.7), rgba(220,20,80,.7));
            border: 2px solid rgba(255,215,0,.9);
            border-radius: 6px;
            position: relative;
            z-index: 2;
            transform-origin: bottom left;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s;
        }

        .gift-lid::after, .gift-body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 100%;
            background: rgba(255,255,255,.8);
        }

        .gift-bow {
            position: absolute;
            top: -24px;
            width: 44px;
            height: 22px;
            z-index: 3;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .gift-bow::before, .gift-bow::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 18px;
            border: 3px solid rgba(255,215,0,.95);
            border-radius: 50% 50% 0 50%;
            top: 0;
        }
        .gift-bow::before { left: 0; transform: rotate(-30deg); }
        .gift-bow::after { right: 0; transform: scaleX(-1) rotate(-30deg); }

        .gift-body {
            width: 140px;
            height: 110px;
            background: linear-gradient(145deg, rgba(220,20,80,.6), rgba(50,5,20,.9));
            border: 2px solid rgba(255,200,50,.8);
            border-top: none;
            border-radius: 0 0 10px 10px;
            position: relative;
        }

        .gift-box-wrapper.open .gift-lid {
            transform: rotate(-60deg) translateY(-55px) translateX(-25px);
            opacity: 0.9;
            filter: drop-shadow(0 15px 15px rgba(255,215,0,0.5));
        }
        .gift-box-wrapper.open .gift-bow {
            transform: translateY(-55px) rotate(-25deg) scale(1.2);
            opacity: 0.9;
        }
        .gift-box-wrapper.open .gift-body {
            transform: scale(1.03);
            box-shadow: 0 0 50px rgba(255,215,0,0.8);
        }

        /* Modal de Felicitación (Página 3) */
        #surprise-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.82);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        #surprise-modal.active { display: flex; }

        .modal-content {
            background: rgba(49, 40, 16, 0.85);
            border: 1px solid rgba(255, 195, 0, 0.45);
            border-radius: 26px;
            padding: 28px 24px 30px;
            max-width: 460px;
            width: 92%;
            text-align: center;
            box-shadow: 0 0 50px rgba(74, 62, 29, 0.95), 0 0 35px rgba(255,190,50,.25);
            position: relative;
            z-index: 101;
        }

        /* Botón estilo píldora con degradado cálido e iluminación dorada (image_acd9fa.png) */
        .btn-gold-glow {
            background: linear-gradient(135deg, #c92a52 0%, #b86b14 100%);
            border: 1px solid rgba(255, 215, 0, 0.85);
            color: #ffffff;
            font-weight: 700;
            border-radius: 9999px;
            padding: 14px 38px;
            font-size: 14px;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-block;
            box-shadow: 0 0 30px rgba(220, 42, 82, 0.75), 0 0 18px rgba(255, 215, 0, 0.6);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .btn-gold-glow:hover {
            transform: scale(1.06);
            background: linear-gradient(135deg, #e03260 0%, #d47e19 100%);
            box-shadow: 0 0 40px rgba(255, 50, 100, 0.9), 0 0 25px rgba(255, 215, 0, 0.8);
        }

        .glass-panel {
            background: rgba(49, 40, 16, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 15px 50px rgba(70, 54, 25, 0.604), 0 0 30px rgba(255, 165, 0, 0.25);
        }

        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            cursor: grab;
        }


        #webgl-canvas:active {
            cursor: grabbing;
        }

        .birthday-scene-title {
            position: fixed;
            top: 42px;
            left: 50%;
            z-index: 45;
            width: min(90vw, 900px);
            margin: 0;
            transform: translateX(-50%);
            opacity: 0;
            color: #ffe08a;
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(22px, 4vw, 46px);
            line-height: 1.1;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(255, 190, 50, .95), 0 0 28px rgba(255, 90, 130, .75);
            animation: birthdayTitleEntrance 1.5s cubic-bezier(.16, 1, .3, 1) .15s forwards, birthdayTitleGlow 2.4s ease-in-out 1.65s infinite alternate;
            pointer-events: none;
        }

        .birthday-scene-title::before,
        .birthday-scene-title::after {
            content: '✦';
            position: absolute;
            top: 50%;
            color: #fff3bd;
            font-size: .55em;
            opacity: 0;
            text-shadow: 0 0 8px #fff, 0 0 20px #ffc247, 0 0 32px #ff7b00;
            animation: birthdayTitleSparkle 1.8s ease-out .55s both;
        }

        .birthday-scene-title::before {
            left: 8%;
        }

        .birthday-scene-title::after {
            right: 8%;
            animation-delay: .85s;
        }

        @keyframes birthdayTitleEntrance {
            0% { opacity: 0; transform: translate(-50%, -28px) scale(.72); filter: blur(8px); }
            65% { opacity: 1; transform: translate(-50%, 4px) scale(1.08); filter: blur(0); }
            82% { transform: translate(-50%, -2px) scale(.98); }
            100% { opacity: 1; transform: translate(-50%, 0) scale(1); filter: blur(0); }
        }

        @keyframes birthdayTitleSparkle {
            0% { opacity: 0; transform: translateY(-50%) scale(.2) rotate(-35deg); }
            35% { opacity: 1; transform: translateY(-50%) scale(1.5) rotate(15deg); }
            100% { opacity: 0; transform: translateY(-50%) scale(.35) rotate(70deg); }
        }

        @keyframes birthdayTitleGlow {
            from { opacity: .82; }
            to { opacity: 1; }
        }

        @media (max-width: 640px) {
            .birthday-scene-title {
                top: 48px;
                width: calc(100vw - 32px);
                letter-spacing: 1px;
            }
        }

        .photo-viewer {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 3vh 3vw;
            background: rgba(0,0,0,.96);
            cursor: zoom-out;
        }
        .photo-viewer.active { display: flex; }
        .photo-viewer img {
            max-width: 94vw;
            max-height: 92vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 0 45px rgba(255,190,50,.25);
            cursor: default;
        }
        #photo-viewer-close {
            position: absolute;
            top: 18px;
            right: 22px;
            z-index: 2;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            color: white;
            font-size: 25px;
            background: rgba(30, 28, 20, 0.85);
            border: 1px solid rgba(255,215,0,.55);
            cursor: pointer;
        }
    </style>
</head>

 <!-- VENTANA MODAL REPRODUCTOR VIDEO VERTICAL -->
<video id="birthdayVideo" class="w-full h-full object-cover" controls preload="metadata" playsinline>

    <!-- LÓGICA JAVASCRIPT GLOBAL Y DE NAVEGACIÓN ENTRE PÁGINAS -->
    <script>
        /* ==========================================
           CONFETI DE FONDO GLOBAL (PÁGINAS 1, 2 Y 3)
           ========================================== */
        const gCanvas = document.getElementById('galaxyCanvas');
        const gctx = gCanvas.getContext('2d');
        
        function resizeG() {
            gCanvas.width = innerWidth;
            gCanvas.height = innerHeight;
        }
        addEventListener('resize', resizeG);
        resizeG();

        class ConfettiPiece {
            constructor() { this.reset(true); }
            reset(init) {
                this.x = Math.random() * gCanvas.width;
                this.y = init ? Math.random() * gCanvas.height : -20;
                this.w = Math.random() * 8 + 4;
                this.h = Math.random() * 4 + 2;
                this.sy = Math.random() * 1.8 + 0.6;
                this.sx = (Math.random() - 0.5) * 1.2;
                this.rot = Math.random() * 360;
                this.rs = (Math.random() - 0.5) * 3;
                this.color = ['#ffd700','#ff2a2a','#2ecc71','#ffffff','#ff9f43','#e74c3c','#1abc9c'][Math.floor(Math.random() * 7)];
                this.alpha = Math.random() * 0.8 + 0.2;
            }
            update() {
                this.y += this.sy;
                this.x += this.sx + Math.sin(this.y * 0.03) * 0.5;
                this.rot += this.rs;
                if (this.y > gCanvas.height + 20) this.reset();
            }
            draw() {
                gctx.save();
                gctx.translate(this.x, this.y);
                gctx.rotate(this.rot * Math.PI / 180);
                gctx.globalAlpha = this.alpha;
                gctx.fillStyle = this.color;

        // // Textura de destello
        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.25, 'rgba(255, 220, 120, 0.95)');
            gradient.addColorStop(0.6, 'rgba(255, 160, 30, 0.4)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        // // Fuegos artificiales
        class Firework {
            constructor(scene, customX = null, customZ = null) {
                this.scene = scene;
                this.isDead = false;
                this.state = 'rocket';

                const startX = customX !== null ? customX : (Math.random() - 0.5) * 20;
                const startZ = customZ !== null ? customZ : (Math.random() - 0.5) * 12 - 3;
                this.targetY = 5.8 + Math.random() * 4.2;

                const colorPalette = [0xffd700, 0xff007f, 0x00f0ff, 0xaa00ff, 0xffea00, 0xff3399, 0xffffff];
                this.color = new THREE.Color(colorPalette[Math.floor(Math.random() * colorPalette.length)]);

                this.currX = startX;
                this.currY = -2.5;
                this.currZ = startZ;

                this.trailParticleCount = 28;
                this.trailPositions = new Float32Array(this.trailParticleCount * 3);
                for (let i = 0; i < this.trailParticleCount; i++) {
                    this.trailPositions[i * 3] = startX;
                    this.trailPositions[i * 3 + 1] = -2.5;
                    this.trailPositions[i * 3 + 2] = startZ;
                }

                const trailGeo = new THREE.BufferGeometry();
                trailGeo.setAttribute('position', new THREE.BufferAttribute(this.trailPositions, 3));

                const trailMat = new THREE.PointsMaterial({
                    size: 0.45,
                    map: glowSparkTexture,
                    color: new THREE.Color(0xffea75),
                    transparent: true,
                    opacity: 0.95,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });

                this.rocket = new THREE.Points(trailGeo, trailMat);
                this.velY = 0.29 + Math.random() * 0.08;
                this.scene.add(this.rocket);
                this.particles = null;
                this.dustParticles = null;
            }

            update() {
                if (this.state === 'rocket') {
                    this.currY += this.velY;
                    const pos = this.rocket.geometry.attributes.position.array;
                    for (let i = this.trailParticleCount - 1; i > 0; i--) {
                        pos[i * 3] = pos[(i - 1) * 3] + (Math.random() - 0.5) * 0.03;
                        pos[i * 3 + 1] = pos[(i - 1) * 3 + 1] - 0.04;
                        pos[i * 3 + 2] = pos[(i - 1) * 3 + 2] + (Math.random() - 0.5) * 0.03;
                    }
                    pos[0] = this.currX + (Math.random() - 0.5) * 0.05;
                    pos[1] = this.currY;
                    pos[2] = this.currZ + (Math.random() - 0.5) * 0.05;
                    this.rocket.geometry.attributes.position.needsUpdate = true;

                    if (this.currY >= this.targetY) {
                        this.explode(this.currX, this.currY, this.currZ);
                    }
                } else if (this.state === 'explode') {
                    this.life -= 0.014;
                    const opacity = Math.max(0, this.life);

                    if (this.particles) {
                        const pos = this.particles.geometry.attributes.position.array;
                        this.particles.material.opacity = opacity;
                        for (let i = 0; i < this.particleCount; i++) {
                            pos[i * 3] += this.velocities[i].x;
                            pos[i * 3 + 1] += this.velocities[i].y;
                            pos[i * 3 + 2] += this.velocities[i].z;
                            this.velocities[i].y -= 0.0028;
                            this.velocities[i].x *= 0.984;
                            this.velocities[i].z *= 0.984;
                        }
                        this.particles.geometry.attributes.position.needsUpdate = true;
                    }

                    if (this.dustParticles) {
                        const dustPos = this.dustParticles.geometry.attributes.position.array;
                        this.dustParticles.material.opacity = opacity * 0.8;
                        for (let i = 0; i < this.dustCount; i++) {
                            dustPos[i * 3] += this.dustVelocities[i].x;
                            dustPos[i * 3 + 1] += this.dustVelocities[i].y;
                            dustPos[i * 3 + 2] += this.dustVelocities[i].z;
                            this.dustVelocities[i].y -= 0.0035;
                            this.dustVelocities[i].x *= 0.975;
                            this.dustVelocities[i].z *= 0.975;
                        }
                        this.dustParticles.geometry.attributes.position.needsUpdate = true;
                    }

                    if (this.life <= 0) {
                        this.cleanup();
                    }
                }
            }

            explode(x, y, z) {
                this.scene.remove(this.rocket);
                this.rocket.geometry.dispose();
                this.rocket.material.dispose();

                this.state = 'explode';
                this.life = 1.0;
                this.particleCount = 260;
                this.dustCount = 180;

                const geo = new THREE.BufferGeometry();
                const positions = new Float32Array(this.particleCount * 3);
                this.velocities = [];

                for (let i = 0; i < this.particleCount; i++) {
                    positions[i * 3] = x;
                    positions[i * 3 + 1] = y;
                    positions[i * 3 + 2] = z;

                    const u = Math.random();
                    const v = Math.random();
                    const theta = u * 2.0 * Math.PI;
                    const phi = Math.acos(2.0 * v - 1.0);
                    const speed = 0.12 + Math.random() * 0.28;

                    this.velocities.push(new THREE.Vector3(
                        speed * Math.sin(phi) * Math.cos(theta),
                        speed * Math.sin(phi) * Math.sin(theta),
                        speed * Math.cos(phi)
                    ));
                }

                geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

                const mat = new THREE.PointsMaterial({
                    size: 0.48,
                    map: glowSparkTexture,
                    color: this.color,
                    transparent: true,
                    opacity: 1.0,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });

                this.particles = new THREE.Points(geo, mat);
                this.scene.add(this.particles);

                const dustGeo = new THREE.BufferGeometry();
                const dustPos = new Float32Array(this.dustCount * 3);
                this.dustVelocities = [];

                for (let i = 0; i < this.dustCount; i++) {
                    dustPos[i * 3] = x;
                    dustPos[i * 3 + 1] = y;
                    dustPos[i * 3 + 2] = z;

                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.random() * Math.PI;
                    const speed = 0.04 + Math.random() * 0.12;

                    this.dustVelocities.push(new THREE.Vector3(
                        speed * Math.sin(phi) * Math.cos(theta),
                        speed * Math.sin(phi) * Math.sin(theta),
                        speed * Math.cos(phi)
                    ));
                }

                dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));

                const dustMat = new THREE.PointsMaterial({
                    size: 0.26,
                    map: glowSparkTexture,
                    color: new THREE.Color(0xfff3b0),
                    transparent: true,
                    opacity: 0.9,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });

                this.dustParticles = new THREE.Points(dustGeo, dustMat);
                this.scene.add(this.dustParticles);
            }

            cleanup() {
                this.isDead = true;
                if (this.particles) {
                    this.scene.remove(this.particles);
                    this.particles.geometry.dispose();
                    this.particles.material.dispose();
                }
                if (this.dustParticles) {
                    this.scene.remove(this.dustParticles);
                    this.dustParticles.geometry.dispose();
                    this.dustParticles.material.dispose();
                }
            }
        }

        // // Velas en espiral
        function createSpiralCandleTexture(baseColor = '#d90429', stripeColor = '#ffffff') {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = stripeColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = baseColor;
            const stripeW = 32;
            for (let y = -256; y < 512; y += stripeW * 2) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(128, y + 128);
                ctx.lineTo(128, y + 128 + stripeW);
                ctx.lineTo(0, y + stripeW);
                ctx.closePath();
                ctx.fill();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(1, 2);
            return texture;
        }

        let candleTextures = null;

        function getCandleTextures() {
            if (!candleTextures) {
                candleTextures = [
                    createSpiralCandleTexture('#0077b6', '#ffffff'),

                    createSpiralCandleTexture('#ffbe0b', '#ffffff')
                ];

            return candleTextures;

        function createCandle(x, y, z, textureIndex = 0) {

            const wickGeo = new THREE.CylinderGeometry(0.007, 0.007, 0.08, 8);
            const wickMat = new THREE.MeshBasicMaterial({ color: 0x1a1a1a });
            const wick = new THREE.Mesh(wickGeo, wickMat);
            wick.position.y = 0.5 + 0.04;
            candleGroup.add(wick);

            const flameGroup = new THREE.Group();
            flameGroup.position.y = 0.58;

            const innerFlameGeo = new THREE.ConeGeometry(0.045, 0.16, 16);
            innerFlameGeo.translate(0, 0.08, 0);
            const innerFlameMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const innerFlame = new THREE.Mesh(innerFlameGeo, innerFlameMat);
            flameGroup.add(innerFlame);

            const outerFlameGeo = new THREE.ConeGeometry(0.075, 0.22, 16);
            outerFlameGeo.translate(0, 0.11, 0);
            const outerFlameMat = new THREE.MeshBasicMaterial({ color: 0xffcc00, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
            const outerFlame = new THREE.Mesh(outerFlameGeo, outerFlameMat);
            flameGroup.add(outerFlame);

            const glowSpriteMat = new THREE.SpriteMaterial({
                map: glowSparkTexture,
                color: 0xffa500,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending
            });
            const glowSprite = new THREE.Sprite(glowSpriteMat);

        // // Glaseado Derretido de Chocolate (Drip Collar)
        function createDripCollarMesh(radius, topY, glazeMat) {
            const perimeter = Math.PI * 2 * radius;
            const dripCount = Math.round(radius * 4.5);
            const segmentWidth = perimeter / dripCount;
            const shape = new THREE.Shape();
            shape.moveTo(0, 0);

            for (let i = 0; i < dripCount; i++) {
                const x0 = i * segmentWidth;
                const x1 = x0 + segmentWidth * 0.35;
                const x2 = x0 + segmentWidth * 0.5;
                const x3 = x0 + segmentWidth * 0.65;
                const x4 = (i + 1) * segmentWidth;

                const dripDepth = 0.22 + ((Math.sin(i * 2.7 + radius * 3) + 1) / 2) * 0.32;
                const bridgeDepth = 0.06 + ((Math.cos(i * 1.8) + 1) / 2) * 0.05;

                shape.bezierCurveTo(x0 + segmentWidth * 0.1, -bridgeDepth, x1, -dripDepth, x2, -dripDepth);
                shape.bezierCurveTo(x3, -dripDepth, x4 - segmentWidth * 0.1, -bridgeDepth, x4, -bridgeDepth);
            }

            shape.lineTo(perimeter, 0);
            shape.lineTo(perimeter, 0.05);
            shape.lineTo(0, 0.05);
            shape.closePath();

            const extrudeSettings = {
                depth: 0.03,
                bevelEnabled: true,
                bevelThickness: 0.025,
                bevelSize: 0.02,
                bevelSegments: 5,
                curveSegments: 16
            };

            const extrudeGeom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            const posAttr = extrudeGeom.attributes.position;
            for (let i = 0; i < posAttr.count; i++) {
                const x = posAttr.getX(i);
                const y = posAttr.getY(i);
                const z = posAttr.getZ(i);

                const theta = x / radius;
                const r = radius + 0.01 + z;

                posAttr.setX(i, r * Math.sin(theta));
                posAttr.setY(i, topY + y);
                posAttr.setZ(i, r * Math.cos(theta));
            }

            extrudeGeom.computeVertexNormals();
            return new THREE.Mesh(extrudeGeom, glazeMat);
        }

        // // Galaxia 3D
        function createChocolateGalaxy() {
            galaxyGroup = new THREE.Group();
            const particleCount = 35000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            const colorInside = new THREE.Color(0xffd700);
            const colorOutside = new THREE.Color(0xff4500);

            for (let i = 0; i < particleCount; i++) {
                const r = Math.pow(Math.random(), 1.5) * 16;
                const spinAngle = r * 0.7;
                const branchAngle = ((i % 4) * Math.PI * 2) / 4;

                positions[i * 3] = Math.cos(branchAngle + spinAngle) * r + (Math.random() - 0.5) * 0.6 * r;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 0.5 - 1.6;
                positions[i * 3 + 2] = Math.sin(branchAngle + spinAngle) * r + (Math.random() - 0.5) * 0.6 * r;

                const mixedColor = colorInside.clone().lerp(colorOutside, r / 16);
                colors[i * 3] = mixedColor.r;
                colors[i * 3 + 1] = mixedColor.g;
                colors[i * 3 + 2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.13,
                sizeAttenuation: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                vertexColors: true,
                transparent: true,
                opacity: 0.95
            });

            galaxyGroup.add(new THREE.Points(geometry, material));
            scene.add(galaxyGroup);
        }

        // // Medallas de Recuerdos
        let memoryBadgesCreated = false;

        function createMemoryBadges() {
            if (memoryBadgesCreated) return;
            memoryBadgesCreated = true;

            const photoRadii = [0.9, 0.78, 0.78, 0.78, 0.78, 0.9];

            const createFallbackTexture = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 256; canvas.height = 256;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#2d1500'; ctx.fillRect(0, 0, 256, 256);
                ctx.font = 'bold 22px Montserrat, sans-serif';
                ctx.fillStyle = '#ffd700'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('✨ RECUERDOS ✨', 128, 128);
                return new THREE.CanvasTexture(canvas);
            };

            MEMORIES_DATA.forEach((data, i) => {
                const createBadgeMesh = (texture) => {
                    texture.generateMipmaps = true;
                    texture.minFilter = THREE.LinearMipmapLinearFilter;

                    const radius = photoRadii[i];
                    const badgeMesh = new THREE.Mesh(
                        new THREE.CircleGeometry(radius, 32),
                        new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide })
                    );

                    const ring = new THREE.Mesh(
                        new THREE.RingGeometry(radius, radius + 0.08, 32),
                        new THREE.MeshStandardMaterial({ color: i % 2 === 0 ? 0xffd700 : 0xff4500, metalness: 0.8, roughness: 0.2, side: THREE.DoubleSide })
                    );
                    badgeMesh.add(ring);

                    badgeMesh.userData = {
                        id: i,
                        data,
                        orbitAngle: (i / MEMORIES_DATA.length) * Math.PI * 2,
                        orbitSpeed: 0.0025,
                        phase: i * 1.1,
                        geometryRadius: radius
                    };

                    memoryBadges.push(badgeMesh);
                    scene.add(badgeMesh);
                    updateMemoryBadgeLayout();
                };

                const image = document.getElementById(`photo-asset-${i + 1}`);
                const addPhotoTexture = () => {
                    if (!image.naturalWidth || !image.naturalHeight) {
                        createBadgeMesh(createFallbackTexture());
                        return;
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = 512;
                    canvas.height = 512;
                    const context = canvas.getContext('2d');
                    const cropSize = Math.min(image.naturalWidth, image.naturalHeight);
                    const cropX = (image.naturalWidth - cropSize) / 2;
                    const cropY = (image.naturalHeight - cropSize) / 2;
                    context.drawImage(image, cropX, cropY, cropSize, cropSize, 0, 0, canvas.width, canvas.height);

                    const texture = new THREE.CanvasTexture(canvas);
                    texture.encoding = THREE.sRGBEncoding;
                    createBadgeMesh(texture);
                };

                if (image.complete) {
                    if (image.naturalWidth > 0) addPhotoTexture();
                    else createBadgeMesh(createFallbackTexture());
                } else {
                    image.addEventListener('load', addPhotoTexture, { once: true });
                    image.addEventListener('error', () => createBadgeMesh(createFallbackTexture()), { once: true });
                }
            });
        }

        function updateMemoryBadgeLayout() {
            const isPortrait = window.innerWidth / window.innerHeight < 1;
            const orbitRadiusX = isPortrait ? 3 : 9.5;
            const orbitRadiusZ = isPortrait ? 7 : 9.5;
            const photoRadius = isPortrait ? 0.58 : 0.82;

            memoryBadges.forEach((badge) => {
                badge.userData.orbitRadiusX = orbitRadiusX;
                badge.userData.orbitRadiusZ = orbitRadiusZ;
                badge.scale.setScalar(photoRadius / badge.userData.geometryRadius);
                updateMemoryBadgePosition(badge);
            });
        }

        function updateMemoryBadgePosition(badge) {
            const { orbitAngle, orbitRadiusX, orbitRadiusZ } = badge.userData;
            const isPortrait = window.innerWidth / window.innerHeight < 1;
            const verticalWave = Math.sin(orbitAngle);
            const height = (isPortrait ? 3.0 : 1.4) + verticalWave * 0.22;
            const tornadoTaper = 1 - (verticalWave + 1) * 0.12;

            badge.userData.baseY = height;
            badge.position.set(
                Math.cos(orbitAngle) * orbitRadiusX * tornadoTaper,
                height,
                Math.sin(orbitAngle) * orbitRadiusZ * tornadoTaper
            );
        }

        // // Emisión de Chispas
        function emitSparkles() {
            if (Math.random() < 0.35) {
                const count = 10;
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(count * 3);
                const velocities = [];

                for (let i = 0; i < count; i++) {
                    positions[i * 3] = (Math.random() - 0.5) * 0.3;
                    positions[i * 3 + 1] = 3.2;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 0.3;

                    velocities.push(new THREE.Vector3((Math.random() - 0.5) * 0.15, 0.18 + Math.random() * 0.25, (Math.random() - 0.5) * 0.15));
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

                const mat = new THREE.PointsMaterial({
                    size: 0.22,
                    map: glowSparkTexture,
                    color: Math.random() < 0.5 ? 0xffd700 : 0xff69b4,
                    transparent: true,
                    opacity: 1.0,
                    blending: THREE.AdditiveBlending
                });

                const pSystem = new THREE.Points(geometry, mat);
                pSystem.userData = { velocities, life: 1.0 };

                sparklesGroup.add(pSystem);
                sparklerParticles.push(pSystem);
            }

            for (let i = sparklerParticles.length - 1; i >= 0; i--) {
                const pSys = sparklerParticles[i];
                const pos = pSys.geometry.attributes.position.array;
                const vels = pSys.userData.velocities;

                pSys.userData.life -= 0.03;
                pSys.material.opacity = pSys.userData.life;

                for (let j = 0; j < vels.length; j++) {
                    pos[j * 3] += vels[j].x;
                    pos[j * 3 + 1] += vels[j].y;
                    pos[j * 3 + 2] += vels[j].z;
                    vels[j].y -= 0.007;
                }

                pSys.geometry.attributes.position.needsUpdate = true;

                if (pSys.userData.life <= 0) {
                    sparklesGroup.remove(pSys);
                    pSys.geometry.dispose();
                    pSys.material.dispose();
                    sparklerParticles.splice(i, 1);
                }
            }
        }

            document.getElementById('photo-viewer-close').addEventListener('click', closePhotoViewer);
            photoViewer.addEventListener('click', (event) => {
                if (event.target === photoViewer) closePhotoViewer();
            });

            // Teclado: + / ] acercan; - / [ alejan. Escape cierra los visores.
            window.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    closePhotoViewer();
                    return;
                }
                if (!is3DInitialized) return;
                if (event.key === '+' || event.key === '=' || event.key === ']') zoomIn();
                if (event.key === '-' || event.key === '_' || event.key === '[') zoomOut();
            });

            const canvas = document.getElementById('webgl-canvas');
            let dragDistance = 0;

            const startDrag = (x, y) => {
                isDragging = true;
                dragDistance = 0;
                previousMousePosition = { x, y };
            };

            const moveDrag = (x, y) => {
                mouse.x = (x / window.innerWidth) * 2 - 1;
                mouse.y = -(y / window.innerHeight) * 2 + 1;

                if (isDragging) {
                    const deltaX = x - previousMousePosition.x;
                    const deltaY = y - previousMousePosition.y;
                    dragDistance += Math.abs(deltaX) + Math.abs(deltaY);

                    targetSpherical.theta -= deltaX * 0.008;
                    targetSpherical.phi -= deltaY * 0.008;
                    targetSpherical.phi = Math.max(0.1, Math.min(Math.PI - 0.2, targetSpherical.phi));

                    previousMousePosition = { x, y };
                }
            };

            const endDrag = () => { isDragging = false; };

            canvas.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
            window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
            window.addEventListener('mouseup', endDrag);

            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) startDrag(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });
            window.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1) moveDrag(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });
            window.addEventListener('touchend', endDrag);

            canvas.addEventListener('click', (e) => {
                if (dragDistance > 8) return;
                onCanvasClick(e);
            });

            // Control de Zoom con Rueda del Ratón
            window.addEventListener('wheel', (e) => {
                if (!is3DInitialized) return;
                if (e.deltaY < 0) zoomIn();
                else zoomOut();
            }, { passive: true });
        }

        function onCanvasClick(e) {
            let clientX = e ? e.clientX : window.innerWidth / 2;
            let clientY = e ? e.clientY : window.innerHeight / 2;

            if (e && e.changedTouches && e.changedTouches.length > 0) {
                clientX = e.changedTouches[0].clientX;
                clientY = e.changedTouches[0].clientY;
            }

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const badgeIntersects = raycaster.intersectObjects(memoryBadges, true);
            if (badgeIntersects.length > 0) {
                let obj = badgeIntersects[0].object;
                while (obj.parent && !obj.userData.data) {
                    obj = obj.parent;
                }
                if (obj.userData.data) {
                    openModal(obj.userData.data);
                    return;
                }
            }

            if (cakeGroup) {
                const cakeIntersects = raycaster.intersectObject(cakeGroup, true);
                if (cakeIntersects.length > 0) {
                    triggerBounceAction();
                    return;
                }
            }

            launchGoldenCluster((mouse.x) * 10, (mouse.y) * 4 - 2);
        }

        function openModal(data) {
            const modal = document.getElementById('message-modal');
            document.getElementById('modal-img').src = data.img;
            document.getElementById('modal-title').innerText = data.title;
            document.getElementById('modal-text').innerText = data.text;

            modal.classList.remove('opacity-0', 'pointer-events-none', 'scale-90');
            modal.classList.add('opacity-100', 'pointer-events-auto', 'scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('message-modal');
            modal.classList.remove('opacity-100', 'pointer-events-auto', 'scale-100');
            modal.classList.add('opacity-0', 'pointer-events-none', 'scale-90');
        }

        // // Bucle de Animación y Renderizado 3D
        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();

            // Parpadeo de llamas
            candleFlames.forEach((c, idx) => {
                const flicker = Math.sin(now * 0.012 + idx * 1.5) * 0.08 + Math.cos(now * 0.025 + idx) * 0.05;
                c.group.scale.set(1 + flicker * 0.4, 1 + flicker * 0.8, 1 + flicker * 0.4);
                c.light.intensity = 0.2 + flicker * 0.1;
            });

            // Fuegos artificiales aleatorios
            if (now - lastFireworkTime > 900) {
                const randomX = (Math.random() - 0.5) * 16;
                fireworksList.push(new Firework(scene, randomX));
                lastFireworkTime = now;
            }

            for (let i = fireworksList.length - 1; i >= 0; i--) {
                fireworksList[i].update();
                if (fireworksList[i].isDead) {
                    fireworksList.splice(i, 1);
                }
            }

            // Suavizado de cámara 360° y Zoom
            cameraSpherical.theta += (targetSpherical.theta - cameraSpherical.theta) * 0.05;
            cameraSpherical.phi += (targetSpherical.phi - cameraSpherical.phi) * 0.05;
            cameraSpherical.radius += (targetSpherical.radius - cameraSpherical.radius) * 0.05;
            updateCameraPosition();

            if (galaxyGroup) {
                galaxyGroup.rotation.y += 0.001;
            }

            textSprites.forEach(sprite => {
                sprite.userData.angle += sprite.userData.speed;
                sprite.position.x = Math.cos(sprite.userData.angle) * sprite.userData.radius;
                sprite.position.z = Math.sin(sprite.userData.angle) * sprite.userData.radius;
            });

            memoryBadges.forEach(badge => {
                badge.userData.orbitAngle += badge.userData.orbitSpeed;
                updateMemoryBadgePosition(badge);
                badge.position.y += Math.sin(now * 0.001 + badge.userData.phase) * 0.12;
                badge.lookAt(camera.position);
            });

            emitSparkles();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            if (is3DInitialized) {
                updateResponsiveCamera();
                updateMemoryBadgeLayout();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }
    </script>
</body>
